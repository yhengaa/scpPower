name: Publish M4 release
on:
  workflow_run:
    workflows: [R-CMD-check]
    types: [completed]
permissions:
  contents: write
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Identify passing M4 commit
        id: version
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          if 'Version: 0.3.0' in Path('DESCRIPTION').read_text().splitlines():
              m=json.loads(Path('reports/M4/run-manifest.json').read_text())
              assert m['overall_verdict']=='PASS' and m['passing_datasets']>=2
              assert m['counted_points']==204
              assert m['prediction_replicates']==m['observation_replicates']==40800
              assert m['no_retuning'] and m['M5_not_executed']
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('publish=true\n')
          PY
      - name: Package M4 evidence
        if: steps.version.outputs.publish == 'true'
        run: python inst/scripts/package_m4_evidence.py
      - name: Tag, release and attach evidence
        if: steps.version.outputs.publish == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const sha = context.payload.workflow_run.head_sha;
            const tag = 'v0.3.0';
            try {
              const prior = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
              if (prior.data.object.sha !== sha) throw new Error('Existing tag points to another commit; refusing to move it.');
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner, repo, ref: `refs/tags/${tag}`, sha});
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({owner, repo, tag_name: tag, target_commitish: sha, name: 'scpPower 0.3.0 — registered M4 validation', draft: false, prerelease: false, body: fs.readFileSync('reports/M4/release-notes.md','utf8')})).data;
            }
            const assets = (await github.rest.repos.listReleaseAssets({owner, repo, release_id: release.id})).data;
            for (const name of ['scpPower_M4_v0.3.0_evidence.zip','scpPower_M4_v0.3.0_evidence-manifest.json']) {
              if (!assets.some(asset => asset.name === name)) {
                const data=fs.readFileSync(name);
                await github.rest.repos.uploadReleaseAsset({owner, repo, release_id:release.id, name, data, headers:{'content-type': name.endsWith('.zip') ? 'application/zip' : 'application/json','content-length':data.length}});
              }
            }
            core.info(`M4 released at ${release.html_url}; checked commit ${sha}`);
