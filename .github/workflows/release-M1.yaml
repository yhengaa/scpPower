name: Publish M1 release
on:
  workflow_run:
    workflows: [R-CMD-check]
    types: [completed]
permissions:
  contents: write
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Identify M1 closure commit
        id: version
        run: |
          if test "$(sed -n 's/^Version: //p' DESCRIPTION)" = '0.1.0'; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Package approved M1 evidence
        if: steps.version.outputs.publish == 'true'
        run: python inst/scripts/package_m1_evidence.py
      - name: Tag, publish and attach evidence
        if: steps.version.outputs.publish == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const sha = context.payload.workflow_run.head_sha;
            const tag = 'v0.1.0';
            try {
              const ref = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
              if (ref.data.object.sha !== sha) throw new Error('Existing M1 tag points to a different commit; refusing to move it.');
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner, repo, ref: `refs/tags/${tag}`, sha});
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({owner, repo, tag_name: tag, target_commitish: sha, name: 'scpPower 0.1.0 — M1 calibration closure', draft: false, prerelease: false, body: fs.readFileSync('reports/M1-final/release-notes.md','utf8')})).data;
            }
            const name = 'scpPower_M1_v0.1.0_evidence.zip';
            const assets = await github.rest.repos.listReleaseAssets({owner, repo, release_id: release.id});
            if (!assets.data.some(asset => asset.name === name)) {
              const data = fs.readFileSync(name);
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name, data, headers: {'content-type': 'application/zip', 'content-length': data.length}});
            }
            core.info(`M1 released at ${release.html_url}; checked commit ${sha}`);
